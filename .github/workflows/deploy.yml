name: ทดสอบและ deploy ขึ้น GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# ให้ GITHUB_TOKEN มีสิทธิ์พอสำหรับ deploy Pages
permissions:
  contents: read
  pages: write
  id-token: write

# ปล่อยให้ deploy ทีละครั้ง ไม่ยกเลิกงานที่กำลังรันอยู่
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: รัน unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: รันเทสต์ทั้งหมด
        run: npm test

      - name: รันเทสต์ซ้ำในหลาย timezone
        run: npm run test:tz

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # เตือนเฉย ๆ ไม่บล็อก deploy — ผลลัพธ์ของ zlib ไม่การันตีว่าเหมือนกัน
      # ข้ามเวอร์ชัน Node/แพลตฟอร์ม การเทียบ byte ต่อ byte จึงพังได้ทั้งที่โค้ดถูก
      - name: ตรวจว่าไอคอนยังสร้างใหม่ได้ (ไม่บล็อก deploy)
        continue-on-error: true
        run: |
          node tools/make-icons.js
          if ! git diff --quiet -- icons/; then
            echo "::warning::icons/ ไม่ตรงกับผลลัพธ์ของ tools/make-icons.js บนเครื่องนี้ (อาจเป็นเพราะ zlib คนละเวอร์ชัน)"
          fi
          git checkout -- icons/

      # ต้องเปิด Pages ไว้ก่อนหนึ่งครั้งที่
      # Settings → Pages → Build and deployment → Source: GitHub Actions
      # (เคยลอง enablement:true ให้เปิดอัตโนมัติ แต่ GITHUB_TOKEN ไม่มีสิทธิ์พอ)
      - uses: actions/configure-pages@v5

      - name: อัปโหลดไฟล์เว็บ (ไม่รวม tools/ tests/ และไฟล์ dev)
        run: |
          mkdir -p _site
          cp -r index.html styles.css core.js alarm.js auth.js app.js sw.js \
                manifest.webmanifest icons README.md _site/
          touch _site/.nojekyll

      # กันพลาดซ้ำ: เคยเพิ่มไฟล์ js ใหม่แล้วลืมใส่ในรายการ cp ข้างบน
      # ผลคือ index.html เรียกไฟล์ที่ไม่ได้ deploy แล้วหน้าเว็บตายทั้งหน้า
      - name: ตรวจว่าไฟล์ที่ index.html เรียกใช้ถูก deploy ครบ
        run: |
          missing=0
          refs=$(grep -oE '(src|href)="[^"]+"' _site/index.html | cut -d'"' -f2)
          for f in $refs; do
            case "$f" in http*|//*|\#*|data:*) continue ;; esac
            if [ ! -e "_site/$f" ]; then
              echo "::error::index.html เรียก '$f' แต่ไม่มีไฟล์นี้ใน _site/"
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
